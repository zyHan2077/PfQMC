name: build-and-test

env:
  # Keep C++ and Fortran on the same release family as the verified WSL setup.
  # The obsolete *-and-cpp-classic package selects 2023.2.4 and can hide ifx.
  LINUX_CPP_COMPONENTS: intel-oneapi-compiler-dpcpp-cpp-2025.3
  LINUX_FORTRAN_COMPONENTS: intel-oneapi-compiler-fortran-2025.3
  LINUX_MKL_COMPONENTS: intel-oneapi-mkl-devel-2025.3
  LINUX_MPI_COMPONENTS: intel-oneapi-mpi-devel-2021.17
  CTEST_NO_TESTS_ACTION: error

on:
  push:
    paths:
      - "inc/**"
      - "src/**"
      - "test/**"
      - "main.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Install through APT on every fresh runner. Caching only /opt/intel/oneapi
      # omits system dependencies and the old constant key preserves mixed releases.
      - name: Install build dependencies and oneAPI
        timeout-minutes: 15
        run: |
          bash .github/workflows/oneapi_setup_apt_repo_linux.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libeigen3-dev libgtest-dev \
            "$LINUX_CPP_COMPONENTS" "$LINUX_FORTRAN_COMPONENTS" \
            "$LINUX_MKL_COMPONENTS" "$LINUX_MPI_COMPONENTS"

      # Activate in each shell; do not copy all runner variables to GITHUB_ENV.
      - name: Check Intel oneAPI environment
        run: |
          source /opt/intel/oneapi/setvars.sh
          command -v icx icpx ifx mpiicpx
          icpx --version
          ifx --version
          mpiicpx --version
          printf 'MKLROOT=%s\n' "$MKLROOT"
          test -f "$MKLROOT/lib/cmake/mkl/MKLConfig.cmake"

      - name: Build PFAPACK
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -C inc/pfapack/fortran mFC=ifx
          make -C inc/pfapack/c_interface

      - name: CMake Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=mpiicpx \
            -DEIGEN3_INCLUDE_DIR=/usr/include/eigen3

      - name: CMake Build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build --parallel 2

      - name: Run tests
        timeout-minutes: 10
        run: |
          source /opt/intel/oneapi/setvars.sh
          ctest --test-dir build --output-on-failure --no-tests=error

      # Preserve diagnostics without an automatic 20-minute interactive session.
      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore
